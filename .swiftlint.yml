included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - vendor

# Owned by swift-format.
disabled_rules:
  - closing_brace
  - closure_parameter_position
  - colon
  - comma
  - control_statement
  - function_name_whitespace
  - leading_whitespace
  - line_length
  - opening_brace
  - return_arrow_whitespace
  - statement_position
  - todo
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_whitespace

opt_in_rules:
  - array_init
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - reduce_into
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

identifier_name:
  min_length:
    warning: 2
    error: 2
  excluded: [x, y, id, on, to, up]

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 120

# An exhaustive switch over an enum's cases is one decision, not one per case; splitting it to
# pass would leave an unreachable branch.
cyclomatic_complexity:
  ignores_case_statements: true
