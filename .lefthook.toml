[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-swift]
glob = ["*.swift"]
exclude = ["**/.build/**"]
run = "swift format --in-place --parallel {staged_files}"
stage_fixed = true

[pre-commit.commands.lint-swift-format]
glob = ["*.swift"]
exclude = ["**/.build/**"]
run = "swift format lint --strict --parallel {staged_files}"

[pre-commit.commands.lint-swift]
glob = ["*.swift"]
exclude = ["**/.build/**"]
run = "swiftlint lint --quiet --strict {staged_files}"

[pre-commit.commands.format-mise]
glob = [".mise.toml", ".mise/config.toml"]
run = "mise fmt"
stage_fixed = true

[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.mise-lock]
glob = [".mise.toml", ".mise/config.toml"]
run = 'mise lock && { for f in {staged_files}; do l="$(dirname "$f")/mise.lock"; [ -f "$l" ] && git add "$l"; done; true; }'

[pre-push]
parallel = false

[pre-push.commands.test]
glob = ["*.swift"]
run = "swift test"


[pre-push.commands.dead-code]
glob = ["*.swift"]
run = "mise run dead-code"
